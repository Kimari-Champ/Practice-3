name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: cmd
        run: |
          echo DB_HOST=${{ secrets.DB_HOST }} > .env
          echo DB_PORT=${{ secrets.DB_PORT }} >> .env
          echo DB_NAME=${{ secrets.DB_NAME }} >> .env
          echo DB_USER=${{ secrets.DB_USER }} >> .env
          echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> .env
          echo APP_PORT=${{ secrets.APP_PORT }} >> .env
          echo APP_SECRET=${{ secrets.APP_SECRET }} >> .env
          echo API_KEY=${{ secrets.API_KEY }} >> .env
          echo COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} >> .env
          echo .env file created successfully
      - name: Save Docker status snapshot
        shell: cmd
        run: |
          docker compose ps > docker-status.txt

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env.example
            docker-status.txt
            test-report.md
            deployment-logs.txt
          retention-days: 30
      - name: Deploy with Docker Compose
        shell: cmd
        run: |
          echo Force Cleaning previous containers...
          docker compose down -v --remove-orphans
          echo Starting application stack...
          docker compose up -d --build
          echo Waiting for database initialization...
          powershell -Command "Start-Sleep -Seconds 35"

      - name: Verify containers are running
        shell: cmd
        run: |
          echo Waiting for services to start and pass healthchecks...
          timeout /t 20 /nobreak >nul
          docker compose ps
          docker compose ps | findstr "Up" >nul
          if errorlevel 1 (
            echo X Some containers failed to start or became unhealthy
            docker compose logs
            exit 1
          ) else (
            echo All containers are running
          )

      - name: Run application tests
        shell: cmd
        run: |
          echo Running application tests...
          curl -f http://localhost:8080/ || curl -f http://localhost:8080/health
          if errorlevel 1 (
            echo X Web application health check failed
            exit 1
          ) else (
            echo Web application is healthy
          )
      - name : Run database query test
        shell: cmd
        run: |
          echo running database test...
          docker compose exec -T db psql -U app -d appdb --command "SELECT COUNT(*) FROM items;"
      - name: Create test report
        if: always()
        shell: cmd
        run: |
          echo # Deployment Test Report > test-report.md
          echo Date: %DATE% %TIME% >> test-report.md
          echo Application: Healthy >> test-report.md
          echo Database: Connected >> test-report.md
          echo Containers: Running >> test-report.md
          docker compose logs > deployment-logs.txt

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
          retention-days: 30

      - name: Cleanup stack
        if: always()
        shell: cmd
        run: docker compose down